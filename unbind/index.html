<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頻帶方向播放器</title>
<style>
:root{--bg:#f9f9f7;--surf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--accent:#2a78d6;
 --c0:#0503a5;--c1:#4602b6;--c2:#7700bb;--c3:#ae049a;--c4:#e20334;--c5:#e65806;--c6:#e2840c;--c7:#daaa08;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--surf:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--accent:#3987e5;
 --c0:#014ad1;--c1:#6238ed;--c2:#9833e6;--c3:#d323bb;--c4:#fe3542;--c5:#fe7126;--c6:#ff9d28;--c7:#fecf00;}}
:root[data-theme="dark"]{--bg:#0d0d0d;--surf:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--accent:#3987e5;
 --c0:#014ad1;--c1:#6238ed;--c2:#9833e6;--c3:#d323bb;--c4:#fe3542;--c5:#fe7126;--c6:#ff9d28;--c7:#fecf00;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Heiti TC",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 16px;font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--grid);border-radius:10px;padding:14px}
canvas{width:100%;display:block}
#cv{height:auto}
#ov{height:56px;cursor:pointer;border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
button,select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--axis);border-radius:6px;padding:5px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);min-width:72px}
input[type=range]{accent-color:var(--accent)}
#seek{flex:1;min-width:160px}
.time{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px;min-width:150px}
label{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.side h2{font-size:14px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
.side h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 8px;border:1px solid var(--grid);border-radius:999px;cursor:pointer;user-select:none;color:var(--ink)}
.chip.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%}
.note{font-size:13px;color:var(--ink2);margin:6px 0 0}
.stat{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ovlab{font-size:12px;color:var(--muted);margin:4px 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:8px;vertical-align:middle;margin-right:4px;border-radius:2px}
table.spk{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.spk td,table.spk th{padding:2px 4px;text-align:right;border-bottom:1px solid var(--grid)}
table.spk th{color:var(--muted);font-weight:500}
table.spk td:first-child,table.spk th:first-child{text-align:left}
</style>
</head>
<body>
<main>
<h1>頻帶方向播放器</h1>
<p class="sub" id="sub"></p>
<p class="sub" id="note" style="margin-top:-10px"></p>
<div class="wrap">
 <div class="card">
  <div class="row">
   <select id="piece" aria-label="作品"></select>
   <select id="track" aria-label="音軌"></select>
   <button class="primary" id="play">▶ 播放</button>
   <select id="rate" aria-label="速度"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="0.1">0.1×</option></select>
   <button id="back" title="上一格（←）">◀︎ 格</button><button id="fwd" title="下一格（→）">格 ▶︎</button>
  </div>
  <div class="row"><input type="range" id="seek" min="0" value="0" step="1" aria-label="時間"><span class="time" id="time"></span></div>
  <canvas id="ov" aria-label="全曲總覽，點一下跳到該時間"></canvas>
  <div class="ovlab"><span><span class="sw" style="background:var(--muted);opacity:.55"></span>擴散聲占比（越高越灰）</span><span><span class="sw" style="background:var(--ink2);height:2px"></span>音量（線）</span><span>點一下跳到該時間</span></div>
  <canvas id="cv" width="760" height="760"></canvas>
 </div>
 <div class="card side">
  <h2>寬頻帶（顏色由低到高：深藍→紫→紅→橙→黃；點一下可隱藏）</h2><div class="chips" id="bands"></div>
  <h2>名次（深淺）</h2>
  <div class="row"><label><input type="checkbox" class="rk" value="0" checked>第 1 名</label><label><input type="checkbox" class="rk" value="1" checked>第 2 名</label><label><input type="checkbox" class="rk" value="2" checked>第 3 名</label></div>
  <h2>殘影</h2>
  <div class="row"><select id="trail"><option value="0">無</option><option value="20">20 ms</option><option value="50" selected>50 ms</option><option value="100">100 ms</option><option value="250">250 ms</option></select></div>
  <h2>只顯示音量高於</h2>
  <div class="row"><input type="range" id="thr" min="-70" max="-20" value="-50" step="5"><span class="stat" id="thrv"></span></div>
  <h2>擴散聲</h2>
  <div class="row"><label><input type="checkbox" id="showDif" checked>灰環（越灰＝該細頻帶擴散聲比例越高；300 Hz 以上）</label></div>
  <h2>5.1 喇叭直達聲分配</h2>
  <div class="row"><label><input type="checkbox" id="showSpk" checked>顯示</label></div>
  <table class="spk" id="spkTab"></table>
  <p class="note">外框＝平滑前（逐格）；實心＝100 ms 平滑後（實際送出）；長條全長＝50%。只算 300 Hz 以上，依各頻帶音量 × 直達聲比例加權。直達聲比例 d 只存了平滑後的值，灰環與擴散聲占比都用平滑後的 d。</p>
  <h2>圖例</h2>
  <p class="note">角度＝水平方位（前在上、左在左）　半徑＝頻率（內低外高，細線為寬頻帶邊界）　點大小＝權重　▲＝仰角 ≥ 30°</p>
  <p class="stat" id="stat"></p>
 </div>
</div>
</main>

.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 60.0, 90.0], "spk": [30.0, -30.0, 0.0, 110.0, -110.0], "spkName": ["L", "R", "C", "Ls", "Rs"], "broadHz": [0, 500, 1000, 2000, 4000, 6000, 9000, 13000, 24001]};
const BL=["0–500","500–1k","1–2k","2–4k","4–6k","6–9k","9–13k","13–24k"];
const RANK_A=[1,0.5,0.22];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);
const fmt=s=>{const m=Math.floor(s/60);return `${m}:${(s-60*m).toFixed(2).padStart(5,"0")}`};
const au=new Audio(); au.preload="auto";
const store={};           // name → {meta, chunks:[], pending:{}}
let P=null, f=0, playing=false;

function addScript(src){const s=document.createElement("script");s.src=src;document.body.appendChild(s)}
window.__meta=m=>{store[m.name].meta=m; if(P&&P.name===m.name) ready()};
async function gunzip(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()}
window.__chunk=async(name,i,n,b64)=>{
  const S=store[name], nB=S.meta.fc.length, buf=await gunzip(b64), u=new Uint8Array(buf);
  const k=nB*3*n; let o=2*k;
  const c={n, dir:new Uint16Array(buf,0,k), w:u.subarray(o,o+nB*n)}; o+=nB*n;
  c.dbd=u.subarray(o,o+nB*n); o+=nB*n; c.sR=u.subarray(o,o+5*n); o+=5*n; c.sS=u.subarray(o,o+5*n); o+=5*n; c.dif=u.subarray(o,o+n);
  S.chunks[i]=c; delete S.pending[i]; if(P&&P.name===name) draw()};
function need(i){const S=store[P.name]; if(i<0||i>=S.meta.nch||S.chunks[i]||S.pending[i])return; S.pending[i]=1; addScript(`data/${P.name}/c${String(i).padStart(3,"0")}.js`)}
function at(g){const M=store[P.name].meta, ci=Math.floor(g/M.chunk), c=store[P.name].chunks[ci]; if(!c){need(ci);return null} return [c,g-ci*M.chunk]}

COMMON.pieces.forEach(p=>{store[p.name]={meta:null,chunks:[],pending:{}};const o=document.createElement("option");o.value=p.name;o.textContent=p.title;$("piece").appendChild(o)});
const bandOn=Array(8).fill(true);
BL.forEach((l,i)=>{const d=document.createElement("div");d.className="chip";d.innerHTML=`<span class="dot" style="background:var(--c${i})"></span>${l} Hz`;
  d.onclick=()=>{bandOn[i]=!bandOn[i];d.classList.toggle("off",!bandOn[i]);draw()};$("bands").appendChild(d)});

function setPiece(name){ if(playing)toggle(); P={name}; f=0;
  const pc=COMMON.pieces.find(p=>p.name===name); $("track").innerHTML=pc.tracks.map((t,i)=>`<option value="${i}">${t.label}</option>`).join("");
  $("track").style.display=pc.tracks.length>1?"":"none"; au.src=pc.tracks[0].file; $("note").textContent=pc.note||"";
  if(store[name].meta) ready(); else addScript(`data/${name}/meta.js`)}
function ready(){const M=store[P.name].meta; P.meta=M;
  $("sub").textContent=`${M.title}（G 版）．整首 ${fmt(M.T*M.hop)}．每格約 ${(M.hop*1000).toFixed(1)} ms．150 Hz 以上的 ${M.fc.length} 個細頻帶 × 前 3 名方向．戴耳機聽`;
  if(startT){f=Math.min(M.T-1,Math.round(startT/M.hop)); au.currentTime=f*M.hop; startT=0}
  $("seek").max=M.T-1; $("seek").value=f; const c0=Math.floor(f/M.chunk); need(c0); need(c0+1); size()}

const cv=$("cv"), ctx=cv.getContext("2d"), ov=$("ov"), octx=ov.getContext("2d");
function size(){const r=window.devicePixelRatio||1, W=cv.clientWidth; cv.width=W*r; cv.height=W*r; ctx.setTransform(r,0,0,r,0,0);
  ov.width=ov.clientWidth*r; ov.height=ov.clientHeight*r; octx.setTransform(r,0,0,r,0,0); draw()}
const L0=Math.log10(150), L1=Math.log10(24000);
const Rf=hz=>((Math.log10(hz)-L0)/(L1-L0))*0.9+0.1;
function xy(az,rr,cx,cy){const a=az*Math.PI/180;return [cx-Math.sin(a)*rr, cy-Math.cos(a)*rr]}
function mark(x,y,r,tri){ctx.beginPath(); if(tri){ctx.moveTo(x,y-r*1.25);ctx.lineTo(x+r*1.1,y+r*0.75);ctx.lineTo(x-r*1.1,y+r*0.75);ctx.closePath()} else ctx.arc(x,y,r,0,2*Math.PI)}

function drawOv(){const M=P.meta, W=ov.clientWidth, H=ov.clientHeight, n=M.ovDb.length;
  octx.fillStyle=css("--bg"); octx.fillRect(0,0,W,H);
  octx.fillStyle=css("--muted"); octx.globalAlpha=0.55;
  for(let i=0;i<n;i++){const x=i/n*W, h=M.ovDif[i]*H; octx.fillRect(x,H-h,W/n+0.5,h)}
  octx.globalAlpha=1; octx.strokeStyle=css("--ink2"); octx.lineWidth=1.2; octx.beginPath();
  for(let i=0;i<n;i++){const x=i/n*W, y=H-(M.ovDb[i]+60)/60*H; i?octx.lineTo(x,y):octx.moveTo(x,y)} octx.stroke();
  const px=f/M.T*W; octx.strokeStyle=css("--ink"); octx.lineWidth=2; octx.beginPath(); octx.moveTo(px,0); octx.lineTo(px,H); octx.stroke()}

function draw(){
  if(!P||!P.meta)return; const M=P.meta, nB=M.fc.length, hop=M.hop;
  drawOv();
  const W=cv.clientWidth, cx=W/2, cy=W/2, R=W*0.33;
  const col=[...Array(8)].map((_,i)=>css("--c"+i)), surf=css("--surf");
  ctx.fillStyle=surf; ctx.fillRect(0,0,W,W);
  ctx.strokeStyle=css("--grid"); ctx.lineWidth=1;
  COMMON.broadHz.slice(1,-1).forEach(h=>{ctx.beginPath();ctx.arc(cx,cy,Rf(h)*R,0,2*Math.PI);ctx.stroke()});
  ctx.strokeStyle=css("--axis"); ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.stroke();
  ctx.fillStyle=css("--muted"); ctx.font="12px -apple-system,'PingFang TC',sans-serif"; ctx.textBaseline="middle";
  ctx.textAlign="center"; ctx.fillText("前 0°",cx,12); ctx.fillText("後 180°",cx,W-12);
  ctx.textAlign="left"; ctx.fillText("左 90°",4,cy); ctx.textAlign="right"; ctx.fillText("右 −90°",W-4,cy); ctx.textAlign="center";
  $("time").textContent=`${fmt(f*hop)}　第 ${f+1}/${M.T} 格`;
  $("thrv").textContent=`${$("thr").value} dB`;
  const cur=at(f); const ci=Math.floor(f/M.chunk); need(ci+1);
  if(!cur){ctx.fillStyle=css("--ink2");ctx.fillText("載入中…",cx,cy);return}
  const [C,t]=cur, n=C.n;
  const thr5=(+$("thr").value+80)/5, ranks=[...document.querySelectorAll(".rk")].filter(e=>e.checked).map(e=>+e.value);
  // 擴散聲灰環
  if($("showDif").checked){ ctx.strokeStyle=css("--ink2");
    for(let b=0;b<nB;b++){ const v=C.dbd[b*n+t]; if(M.fc[b]<300||!bandOn[M.broad[b]]||(v>>4)<thr5)continue;
      const r=Rf(M.fc[b])*R, rn=b+1<nB?Rf(M.fc[b+1])*R:R, rp=b>0?Rf(M.fc[b-1])*R:r-(rn-r);
      ctx.globalAlpha=0.32*(1-(v&15)/15); ctx.lineWidth=Math.max(1,(rn-rp)/2.2);
      ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke(); }
    ctx.globalAlpha=1; }
  const K=Math.round(+$("trail").value/1000/hop);
  ctx.lineWidth=0.8; ctx.strokeStyle=surf; let nLoud=0;
  for(let k=K;k>=0;k--){
    const g=f-k; if(g<0)continue; const cg=at(g); if(!cg)continue; const [G,tg]=cg, gn=G.n;
    const fade=k===0?1:0.35*(1-k/(K+1)), sc=k===0?1:0.6;
    for(const j of [2,1,0]){ if(!ranks.includes(j))continue;
      for(let b=0;b<nB;b++){
        const bb=M.broad[b]; if(!bandOn[bb])continue;
        if((G.dbd[b*gn+tg]>>4)<thr5)continue; if(k===0&&j===0)nLoud++;
        const wv=G.w[b*gn+tg], w1=(wv>>4)/15, w2=(wv&15)/15, wt=j===0?w1:j===1?w2:Math.max(0,1-w1-w2);
        const d=G.dir[(b*3+j)*gn+tg];
        const [x,y]=xy(COMMON.az[d],Rf(M.fc[b])*R,cx,cy);
        ctx.globalAlpha=RANK_A[j]*fade; ctx.fillStyle=col[bb];
        mark(x,y,(2.2+7*Math.sqrt(wt))*sc,COMMON.el[d]>=30); ctx.fill(); if(k===0)ctx.stroke();
      }}
  }
  ctx.globalAlpha=1;
  const tab=[];
  if($("showSpk").checked){
    const ink=css("--ink2"), maxL=R*0.26;
    COMMON.spk.forEach((a,s)=>{
      const raw=C.sR[s*n+t]/255, sm=C.sS[s*n+t]/255; tab.push([COMMON.spkName[s],a,raw,sm]);
      const ang=a*Math.PI/180, ux=-Math.sin(ang), uy=-Math.cos(ang), px=-uy, py=ux, bw=7, r0=R*1.03;
      const bar=(len,fill)=>{const x0=cx+ux*r0,y0=cy+uy*r0,x1=cx+ux*(r0+len),y1=cy+uy*(r0+len);
        ctx.beginPath();ctx.moveTo(x0+px*bw,y0+py*bw);ctx.lineTo(x1+px*bw,y1+py*bw);ctx.lineTo(x1-px*bw,y1-py*bw);ctx.lineTo(x0-px*bw,y0-py*bw);ctx.closePath();
        if(fill){ctx.fillStyle=ink;ctx.globalAlpha=0.55;ctx.fill();ctx.globalAlpha=1}else{ctx.strokeStyle=ink;ctx.lineWidth=1.4;ctx.stroke()}};
      bar(Math.min(1,sm/0.5)*maxL,true); bar(Math.min(1,raw/0.5)*maxL,false);
      const [lx,ly]=xy(a,r0+maxL+16,cx,cy); ctx.fillStyle=css("--ink"); ctx.fillText(COMMON.spkName[s],lx,ly);
    });
  }
  $("spkTab").innerHTML="<tr><th>喇叭</th><th>方位</th><th>平滑前</th><th>平滑後</th></tr>"+tab.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}°</td><td>${(r[2]*100).toFixed(0)}%</td><td>${(r[3]*100).toFixed(0)}%</td></tr>`).join("")
    +`<tr><td colspan="3">此格擴散聲占比（平均分給所有喇叭）</td><td>${(C.dif[t]/2.55).toFixed(0)}%</td></tr>`;
  $("stat").textContent=`此格顯示 ${nLoud} 個細頻帶`;
}

function seekTo(g){if(!P||!P.meta)return; f=Math.max(0,Math.min(P.meta.T-1,g)); $("seek").value=f; au.currentTime=f*P.meta.hop; draw()}
function loop(){ if(!playing)return; f=Math.min(P.meta.T-1,Math.floor(au.currentTime/P.meta.hop)); $("seek").value=f; draw();
  if(au.ended){toggle();return} requestAnimationFrame(loop)}
function toggle(){ if(!P||!P.meta)return; playing=!playing; $("play").textContent=playing?"❚❚ 暫停":"▶ 播放";
  if(playing){ au.currentTime=f*P.meta.hop; au.playbackRate=+$("rate").value; au.play(); requestAnimationFrame(loop)} else au.pause()}
$("play").onclick=toggle;
$("piece").onchange=e=>setPiece(e.target.value);
$("track").onchange=e=>{const pc=COMMON.pieces.find(p=>p.name===P.name), was=playing; if(playing)toggle(); au.src=pc.tracks[+e.target.value].file; au.currentTime=f*P.meta.hop; if(was)toggle()};
$("rate").onchange=e=>{au.playbackRate=+e.target.value};
$("seek").oninput=e=>seekTo(+e.target.value);
$("back").onclick=()=>seekTo(f-1); $("fwd").onclick=()=>seekTo(f+1);
ov.addEventListener("click",e=>{const r=ov.getBoundingClientRect(); seekTo(Math.round((e.clientX-r.left)/r.width*P.meta.T))});
["thr","trail","showSpk","showDif"].forEach(id=>$(id).addEventListener("input",draw));
document.querySelectorAll(".rk").forEach(e=>e.onchange=draw);
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="SELECT"){e.preventDefault();toggle()}
  if(e.key==="ArrowRight")seekTo(f+1); if(e.key==="ArrowLeft")seekTo(f-1)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
window.addEventListener("resize",size);
const QS=new URLSearchParams(location.search); let startT=+(QS.get("t")||0);
const p0=COMMON.pieces.find(p=>p.name===QS.get("piece"))||COMMON.pieces[0]; $("piece").value=p0.name; setPiece(p0.name);
</script>
